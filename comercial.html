
<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SICLO | Comercial</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

body{
font-family:'Inter',sans-serif;
background:#050508;
color:white;
margin:0;
}

/* header igual al index */

.header{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
width:90%;
max-width:1400px;
height:70px;
border-radius:18px;
background:rgba(30,30,30,0.6);
backdrop-filter:blur(20px);
display:flex;
align-items:center;
justify-content:space-between;
padding:0 25px;
border:1px solid rgba(255,255,255,0.05);
}

.logo{
letter-spacing:.3rem;
font-size:.9rem;
}

/* layout */

.container{

padding-top:180px;
width:80%;
max-width:1000px;
margin:auto;

}

/* cards */

.menu{

display:grid;
grid-template-columns:repeat(2,1fr);
gap:40px;

}

.card{

height:160px;

border-radius:18px;

border:1px solid rgba(255,255,255,.06);

background:rgba(255,255,255,.02);

display:flex;
align-items:center;
justify-content:center;

letter-spacing:.2rem;

cursor:pointer;

transition:.3s;

text-decoration:none;
color:white;

}

.card:hover{

border-color:#6C8CFF;
background:rgba(108,140,255,0.06);

}

</style>

</head>


<body>

<div class="header">
<div class="logo">SICLO</div>
</div>

<div class="container">

<h2 style="margin-bottom:60px;letter-spacing:.3rem;font-weight:400">
COMERCIAL
</h2>

<div class="menu">

<a href="vinculaciones.html" class="card">
Vinculaciones
</a>

<a href="presupuesto.html" class="card">
Presupuesto
</a>

<a href="censo.html" class="card">
Censo
</a>

<a href="#" class="card">
InterPay
</a>

</div>

</div>

</body>
</html>
