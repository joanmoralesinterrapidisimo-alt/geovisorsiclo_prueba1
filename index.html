<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>
      ArcGIS Developer Guide: Display a map style with an access token
    </title>
    <style>
      html,
      body,
      #map {
        padding: 0;
        margin: 0;
        height: 100%;
        width: 100%;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 14px;
        color: #323232;
      }

      .maplibregl-ctrl-bottom-right {
        margin-left: 55px;
      }
    </style>

    <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
    <link
      href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="map"></div>

    <script>

      const accessToken = "AAPT3NKHt6i2urmWtqOuugvr9YKeAdTbmdvFrm5yqSBs3PvoI3_35WdBClipG8D7dhk8d0DUBe2qZ1_Lez2vWq-akM4kZTmvbdawIPwlJQyKHiiNClBctzVcAhqR8rP_1VNMV3NwN_i99q6aFQ5nxcfRzdoAeMLs3yHQ2ETH1KI6WqcXVcmD1bDA3AUrLxrvRYGDb2NanQWmwL1R1J6xyTewB61vu7WCV8Aqk9Ivduhpf9GL8lh69RN7JD4_8wrreu7_"

      // Access the basemap service and style
      const map = new maplibregl.Map({
        container: "map",
        style: `https://basemapstyles-api.arcgis.com/arcgis/rest/services/styles/v2/styles/open/osm-style-relief?token=${accessToken}`,
        zoom: 13, // starting zoom
        center: [-119.0265, 37.639], // starting location [longitude, latitude]
        maxZoom: 16, // limit zoom out
        minZoom: 12, // limit zoom in
        maxBounds: [ // limit map extent for pan
          [-119.1486, 37.5667],
          [-118.9147, 37.6956],
        ]
      })

      // Limit user interactions
      map.dragRotate.disable()
      map.touchZoomRotate.disableRotation()
      map.setMaxPitch(0)
      map.setMinPitch(0)
      map.touchPitch.disable()
