<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>SICLO — ArcGIS Basemap</title>

    <style>
      html,
      body,
      #map {
        padding: 0;
        margin: 0;
        height: 100%;
        width: 100%;
        font-family: Arial, Helvetica, sans-serif;
      }

      .maplibregl-ctrl-bottom-right {
        margin-left: 55px;
      }
    </style>

    <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
    <link
      href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="map"></div>

    <script>
      // 🔑 TU TOKEN DE ARCGIS
      const accessToken = "AAPT3NKHt6i2urmWtqOuugvr9YKeAdTbmdvFrm5yqSBs3PvoI3_35WdBClipG8D7dhk8d0DUBe2qZ1_Lez2vWq-akM4kZTmvbdawIPwlJQyKHiiNClBctzVcAhqR8rP_1VNMV3NwN_i99q6aFQ5nxcfRzdoAeMLs3yHQ2ETH1KI6WqcXVcmD1bDA3AUrLxrvRYGDb2NanQWmwL1R1J6xyTewB61vu7WCV8Aqk9Ivduhpf9GL8lh69RN7JD4_8wrreu7_";

      // 📍 Centro en Bogotá
      const bogotaCenter = [-74.08175, 4.60971];

      // 🗺️ Crear mapa
      const map = new maplibregl.Map({
        container: "map",
        style: `https://basemapstyles-api.arcgis.com/arcgis/rest/services/styles/v2/styles/open/osm-style-relief?token=${accessToken}`,
        center: bogotaCenter,
        zoom: 12,
        minZoom: 10,
        maxZoom: 19,
        pitch: 0,
        bearing: 0,
        maxBounds: [
          [-74.35, 4.45], // suroccidente Bogotá
          [-73.95, 4.85]  // nororiente Bogotá
        ]
      });

      // 🚫 Desactivar rotaciones (estilo GIS clásico)
      map.dragRotate.disable();
      map.touchZoomRotate.disableRotation();
      map.touchPitch.disable();
      map.setMaxPitch(0);
      map.setMinPitch(0);

      // ➕ Controles
      map.addControl(new maplibregl.NavigationControl(), "bottom-right");
      map.addControl(new maplibregl.ScaleControl({
        maxWidth: 120,
        unit: "metric"
      }));

      // 📍 Marcador SICLO (opcional)
      const marker = new maplibregl.Marker({ color: "#8a2be2" })
        .setLngLat(bogotaCenter)
        .addTo(map);

      // 🎯 Evento listo para integrar capas ArcGIS
      map.on("load", () => {
        console.log("Mapa SICLO listo");

        // Aquí podrás añadir:
        // - capas vectoriales
        // - GeoJSON
        // - tiles
        // - servicios ArcGIS
      });
    </script>
  </body>
</html>
