<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SICLO | Sistema de Integración Comercial y Logístico</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

/* ===== BASE ===== */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Inter',sans-serif;
background:#050508;
color:white;

}

/* ===== HEADER ===== */

.header{

position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);

width:90%;
max-width:1400px;

height:70px;

border-radius:18px;

background:rgba(30,30,30,0.6);
backdrop-filter:blur(20px);

display:flex;
align-items:center;
justify-content:space-between;

padding:0 25px;

border:1px solid rgba(255,255,255,0.05);

z-index:50;

}

/* logo */

.logo{

font-weight:500;
letter-spacing:.3rem;
font-size:.9rem;

}

/* search */

.search-box{

flex:1;
display:flex;
justify-content:center;

}

.search{

width:420px;
height:40px;

border-radius:12px;

border:1px solid rgba(255,255,255,.08);

background:rgba(0,0,0,.4);

color:white;

padding:0 15px;

font-size:.85rem;

}

/* header icons */

.header-right{

display:flex;
gap:20px;

}

.icon{

opacity:.7;
cursor:pointer;

}

/* ===== HERO ===== */

.hero{

padding-top:180px;

display:flex;
flex-direction:column;
align-items:center;

}

/* title */

.title{

font-size:3rem;
letter-spacing:1.4rem;
font-weight:300;

margin-bottom:15px;

}

.subtitle{

font-size:.85rem;
letter-spacing:.4rem;
color:rgba(255,255,255,.5);

margin-bottom:120px;

}

/* ===== MODULES ===== */

.modules{

display:grid;
grid-template-columns:repeat(4,1fr);

gap:40px;

width:80%;
max-width:1200px;

}

/* module card */

.card{

height:180px;

border-radius:18px;

border:1px solid rgba(255,255,255,.06);

background:rgba(255,255,255,0.02);

display:flex;
align-items:center;
justify-content:center;

font-size:.9rem;

letter-spacing:.2rem;

transition:.3s;

cursor:pointer;

}

.card:hover{

border-color:#6C8CFF;

background:rgba(108,140,255,0.06);

transform:translateY(-6px);

}

.footer{

margin-top:120px;

font-size:.7rem;
letter-spacing:.3rem;

color:rgba(255,255,255,.4);

}

</style>
</head>


<body>


<!-- HEADER -->

<div class="header">

<div class="logo">
SICLO
</div>

<div class="search-box">

<input class="search" placeholder="Busca dirección, predio o microzona">

</div>

<div class="header-right">

<div class="icon">☰</div>

</div>

</div>


<!-- HERO -->

<section class="hero">

<div class="title">
SICLO
</div>

<div class="subtitle">
SISTEMA DE INTEGRACIÓN COMERCIAL Y LOGÍSTICO
</div>


<div class="modules">

<a href="nogeo.html" class="card">
NoGeo
</a>

<a href="logistica.html" class="card">
Logística
</a>

<a href="comercial.html" class="card">
Comercial
</a>

<a href="gerencial.html" class="card">
Gerencial
</a>

</div>

</div>


<div class="footer">

By Inter Rapidísimo

</div>

</section>


</body>
</html>
